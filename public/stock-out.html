<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Stock Out - StockShelf</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


   

    <aside class="sidebar">

        <h2>StockShelf</h2>

        <nav>

            <a href="/">
                Dashboard
            </a>

            <a href="/products.html">
                Products
            </a>

            <a href="/stock-in.html">
                Stock In
            </a>

            <a href="/stock-out.html"
               class="active">
                Stock Out
            </a>

            <a href="/rack-shelves.html">
                Racks & Shelves
            </a>

            <a href="stock-history.html">
                Stock History
            </a>

        </nav>

    </aside>


   

    <main class="main-content">

        <header>

            <h1>Stock Out</h1>

            <p>
                Remove stock from your inventory
            </p>

        </header>


       

        <section class="add-product">

            <h2>Remove Stock</h2>


            <form id="stockOutForm">


       

                <label>
                    Select Product
                </label>

                <select id="productSelect" required>

                    <option value="">
                        Select a product
                    </option>

                </select>


          

                <label>
                    Quantity
                </label>

                <input
                    type="number"
                    id="stockQuantity"
                    min="1"
                    placeholder="Enter quantity"
                    required
                >


            

                <button type="submit">
                    Remove Stock
                </button>


                <p id="stockMessage"></p>


            </form>

        </section>


    </main>


    <script src="stock-out.js"></script>

</body>

</html>
