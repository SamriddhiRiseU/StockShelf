<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Stock History - StockShelf</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>



    <aside class="sidebar">

        <h2>StockShelf</h2>

        <nav>

            <a href="/">
                Dashboard
            </a>

            <a href="/products.html">
                Products
            </a>

            <a href="/stock-in.html">
                Stock In
            </a>

            <a href="/stock-out.html">
                Stock Out
            </a>

            <a href="/rack-shelves.html">
                Racks & Shelves
            </a>

            <a
                href="/stock-history.html"
                class="active"
            >
                Stock History
            </a>

        </nav>

    </aside>


  

    <main class="main-content">

        <header>

            <h1>
                Stock History
            </h1>

            <p>
                View all stock transactions
            </p>

        </header>


        <section class="recent">

            <h2>
                Transaction History
            </h2>


            <table>

                <thead>

                    <tr>

                        <th>Product</th>

                        <th>SKU</th>

                        <th>Type</th>

                        <th>Quantity</th>

                        <th>Date</th>

                    </tr>

                </thead>


                <tbody id="historyTableBody">

                </tbody>

            </table>

        </section>

    </main>


    <script src="stock-history.js"></script>
