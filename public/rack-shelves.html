<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Racks & Shelves - StockShelf</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>



    <aside class="sidebar">

        <h2>StockShelf</h2>

        <nav>

            <a href="/">
                Dashboard
            </a>

            <a href="/products.html">
                Products
            </a>

            <a href="/stock-in.html">
                Stock In
            </a>

            <a href="/stock-out.html">
                Stock Out
            </a>

            <a
                href="/rack-shelves.html"
                class="active"
            >
                Racks & Shelves
            </a>

            <a href="/stock-history.html">
                Stock History
            </a>

        </nav>

    </aside>


  

    <main class="main-content">

        <header>

            <h1>
                Racks & Shelves
            </h1>

            <p>
                View products according to their storage location
            </p>

        </header>



        <section class="add-product">

            <h2>
                Search Storage
            </h2>

            <input
                type="text"
                id="searchInput"
                placeholder="Search by rack, shelf or product..."
            >

        </section>


       

        <section class="recent">

            <h2>
                Storage Locations
            </h2>


            <table>

                <thead>

                    <tr>

                        <th>Product</th>

                        <th>SKU</th>

                        <th>Category</th>

                        <th>Quantity</th>

                        <th>Rack</th>

                        <th>Shelf</th>

                        <th>Price</th>

                    </tr>

                </thead>


                <tbody id="storageTableBody">

                </tbody>

            </table>

        </section>

    </main>


    <script src="rack-shelves.js"></script>

</body>

</html>
