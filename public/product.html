<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - StockShelf</title>


<link rel="stylesheet" href="style.css">

</head>

<body>



<aside class="sidebar">

    <h2>StockShelf</h2>

    <nav>
        <a href="/">Dashboard</a>

        <a href="/products.html" class="active">
            Products
        </a>

        <a href="/stock-in.html">
            Stock In
        </a>

        <a href="/stock-out.html">
            Stock Out
        </a>

        <a href="/rack-shelves.html">
            Racks & Shelves
        </a>

        <a href="/stock-history.html">
            Stock History
        </a>
    </nav>

</aside>



<main class="main-content">

    <header>
        <h1>Products</h1>
        <p>Manage all your products</p>
    </header>


    
    <section class="add-product">

        <h2>Search Products</h2>

        <input
            type="text"
            id="searchInput"
            placeholder="Search by product name or SKU..."
        >

    </section>


    <section class="recent">

        <h2>All Products</h2>

        <table>

            <thead>
                <tr>
                    <th>Product</th>
                    <th>SKU</th>
                    <th>Category</th>
                    <th>Quantity</th>
                    <th>Min Stock</th>
                    <th>Rack</th>
                    <th>Shelf</th>
                    <th>Price</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="productsTableBody">
            </tbody>

        </table>

    </section>

</main>


<script src="product.js"></script>

</body>

</html>
